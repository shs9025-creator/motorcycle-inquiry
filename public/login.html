<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>관리자 로그인 | MOTO DIRECT</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body { font-family: Pretendard, -apple-system, sans-serif; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 flex items-center justify-center min-h-screen p-4">
  <div class="max-w-md w-full bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-2xl space-y-6">
    <div class="text-center space-y-2">
      <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-sky-500/10 text-sky-400 text-2xl mb-2">
        <i class="fa-solid fa-lock"></i>
      </div>
      <h1 class="text-2xl font-black text-white">관리자 로그인</h1>
      <p class="text-xs text-slate-400">오토바이 구매 문의 접수 내역 관리 시스템</p>
    </div>

    <form id="loginForm" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1.5">관리자 비밀번호</label>
        <input type="password" id="password" required placeholder="비밀번호를 입력하세요"
               class="w-full bg-slate-950 border border-slate-700 rounded-lg px-4 py-3 text-sm text-white focus:outline-none focus:border-sky-500">
      </div>
      <div id="errMsg" class="text-xs text-rose-400 hidden"></div>
      <button type="submit" id="submitBtn"
              class="w-full bg-sky-500 hover:bg-sky-400 text-slate-950 font-extrabold py-3 rounded-lg transition duration-200">
        로그인
      </button>
    </form>

    <div class="text-center">
      <a href="/" class="text-xs text-slate-500 hover:text-slate-400 transition">
        ← 랜딩페이지로 돌아가기
      </a>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const pw = document.getElementById('password').value;
      const errMsg = document.getElementById('errMsg');
      const submitBtn = document.getElementById('submitBtn');

      errMsg.classList.add('hidden');
      submitBtn.disabled = true;
      submitBtn.textContent = "인증 중...";

      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: pw })
        });
        const data = await res.json();
        if (res.ok && data.token) {
          localStorage.setItem('admin_token', data.token);
          window.location.href = '/admin.html';
        } else {
          errMsg.textContent = data.detail || '비밀번호가 올바르지 않습니다.';
          errMsg.classList.remove('hidden');
        }
      } catch (err) {
        errMsg.textContent = '서버 통신 오류가 발생했습니다.';
        errMsg.classList.remove('hidden');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "로그인";
      }
    });
  </script>
</body>
</html>
